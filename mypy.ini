# mypy gradual typing (Phase 5).
# Strict on the `vf` CLI, state and registry modules (the agent-facing surface
# gated by `vf check`); lenient elsewhere. Run via `vf check` (uses p2 venv)
# or `./apps/worker/.venv/bin/python -m mypy <files>`.
#
# Module names assume mypy_path=apps/worker, so:
#   apps/worker/src/services/error_codes.py -> src.services.error_codes
#   scripts/migrate_ledger.py -> migrate_ledger (scripts/ has no package)
#   scripts/vf -> vf (extensionless script, basename)

[mypy]
python_version = 3.12
mypy_path = apps/worker
explicit_package_bases = True
ignore_missing_imports = True
allow_untyped_defs = True
allow_incomplete_defs = True
check_untyped_defs = False
warn_return_any = False
warn_redundant_casts = False
warn_unused_ignores = False
show_error_codes = True
follow_imports = silent

# --- Strict: vf CLI ---
[mypy-vf]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True

[mypy-migrate_ledger]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True

# --- Strict: state (checkpoint) + registry (series_registry, publishers) ---
[mypy-src.services.checkpoint]
